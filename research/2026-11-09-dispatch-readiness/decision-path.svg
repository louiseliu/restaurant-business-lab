<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">从哪段等待开始查</title><desc id="desc">接单至备妥拖长时查排队制作和打包；备妥至取走拖长时查上报、取餐点和交接；骑手到取餐点至取走拖长时先对照餐品是否已备妥。三段可能重叠，不能相加，不直接决定采购。</desc><style>text{font-family:system-ui,'Noto Sans CJK SC',sans-serif;fill:#203d38}.head{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:21px}.small{font-size:19px;fill:#4c655f}.fine{font-size:17px;fill:#4c655f}</style><rect width="960" height="610" fill="#ffffff" rx="12"/><text x="34" y="47" class="head">图2  三段记录 指向不同的下一问</text><text x="34" y="80" class="small">诊断顺序示意 · 多种问题可以同时存在</text><rect x="28" y="116" width="904" height="121" fill="#eff4ef" rx="9"/><text x="49" y="159" class="head">01</text><text x="108" y="159" class="label">接单 → 真实备妥</text><text x="108" y="195" class="body">开工前在排队 还是制作或打包卡住？</text><text x="108" y="224" class="small">再查忙时工序、订单结构和人员部署。</text><rect x="28" y="256" width="904" height="121" fill="#eff4ef" rx="9"/><text x="49" y="299" class="head">02</text><text x="108" y="299" class="label">真实备妥 → 实际取走</text><text x="108" y="335" class="body">信息晚报 取餐点难找 还是交接等待？</text><text x="108" y="364" class="small">先查上报与交接 不直接增加厨房设备。</text><rect x="28" y="396" width="904" height="121" fill="#eff4ef" rx="9"/><text x="49" y="439" class="head">03</text><text x="108" y="439" class="label">骑手到取餐点 → 实际取走</text><text x="108" y="475" class="body">餐是否已经备妥？等待发生在哪一侧？</text><text x="108" y="504" class="small">对照前两段 再查人餐匹配与高峰积压。</text><text x="34" y="566" class="small">三段不能相加；“接单至备妥”也不等于纯烹饪时间。</text></svg>