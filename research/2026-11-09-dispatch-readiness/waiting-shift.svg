<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">等待落在谁身上</title><desc id="desc">三个假设场景保持餐品备妥时刻相同。骑手早到会等餐，接近备妥时到店会缩短骑手等待，更晚到可能延迟取走并增加餐品等待。图不按分钟比例绘制。</desc><style>text{font-family:system-ui,'Noto Sans CJK SC',sans-serif;fill:#203d38}.head{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:21px}.small{font-size:19px;fill:#4c655f}.fine{font-size:17px;fill:#4c655f}</style><rect width="960" height="610" fill="#ffffff" rx="12"/><text x="34" y="47" class="head">图1  同样的备妥时刻 不同的等待</text><text x="34" y="80" class="small">作者假设场景 · 无分钟刻度 · 不是平台实测</text><line x1="625" y1="112" x2="625" y2="498" stroke="#8aa49b" stroke-dasharray="8 6"/><text x="625" y="110" class="label" text-anchor="middle">餐品备妥</text><text x="34" y="164" class="label">早到</text><line x1="260" y1="185" x2="925" y2="185" stroke="#b9c6c0" stroke-width="3"/><rect x="275" y="166" width="425" height="21" fill="#ecd7ab" rx="3"/><rect x="625" y="192" width="75" height="16" fill="#b7d9d1" rx="3"/><circle cx="275" cy="185" r="7" fill="#1d5e52"/><path d="M700 176 l9 9 l-9 9 l-9 -9 Z" fill="#173b34"/><text x="275" y="231" class="fine" text-anchor="middle">骑手到取餐点</text><text x="34" y="255" class="small">取走时间未必更早</text><text x="34" y="289" class="label">接近备妥时到</text><line x1="260" y1="310" x2="925" y2="310" stroke="#b9c6c0" stroke-width="3"/><rect x="535" y="291" width="165" height="21" fill="#ecd7ab" rx="3"/><rect x="625" y="317" width="75" height="16" fill="#b7d9d1" rx="3"/><circle cx="535" cy="310" r="7" fill="#1d5e52"/><path d="M700 301 l9 9 l-9 9 l-9 -9 Z" fill="#173b34"/><text x="535" y="356" class="fine" text-anchor="middle">骑手到取餐点</text><text x="34" y="380" class="small">匹配改善 厨房产能不一定变</text><text x="34" y="414" class="label">晚到</text><line x1="260" y1="435" x2="925" y2="435" stroke="#b9c6c0" stroke-width="3"/><rect x="835" y="416" width="65" height="21" fill="#ecd7ab" rx="3"/><rect x="625" y="442" width="275" height="16" fill="#b7d9d1" rx="3"/><circle cx="835" cy="435" r="7" fill="#1d5e52"/><path d="M900 426 l9 9 l-9 9 l-9 -9 Z" fill="#173b34"/><text x="835" y="481" class="fine" text-anchor="middle">骑手到取餐点</text><text x="34" y="505" class="small">骑手少等 餐可能更晚离店</text><rect x="34" y="549" width="28" height="16" fill="#ecd7ab" rx="3"/><text x="73" y="564" class="small">骑手等待</text><rect x="204" y="549" width="28" height="16" fill="#b7d9d1" rx="3"/><text x="243" y="564" class="small">餐品等待</text><text x="401" y="564" class="small">● 到取餐点    ◆ 实际取走</text><text x="34" y="597" class="fine">三种假设场景均保持备妥时刻相同；色带长度只表示关系 不代表分钟。</text></svg>