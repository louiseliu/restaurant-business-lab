<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="t1 d1"><title id="t1">风险排序与动态预测的决策链</title><desc id="d1">风险排序使用设备履历与停机后果，安排优先复核和维护计划。动态预测还需要连续状态信号、未来时段验证和足够的预警提前量。两者均须保持合规维保底线。本图为原创定性示意，非实测数据。</desc><defs><marker id="arr1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#80918d"/></marker></defs><rect width="560" height="650" rx="12" fill="#f5f6f2"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#172e2b"><text x="30" y="43" font-size="24" font-weight="700">同样是管设备　回答的问题不同</text><text x="30" y="75" font-size="17" fill="#52645f">原创定性示意 · 非实测数据</text><path d="M30 96H530" stroke="#ccd6ce"/><text x="30" y="133" font-size="23" font-weight="700">风险排序</text><text x="30" y="166" font-size="21">谁值得先关注</text><rect x="30" y="188" width="500" height="58" rx="6" fill="#e4ebe3"/><text x="280" y="225" text-anchor="middle" font-size="21">设备履历 ＋ 停机后果 ＋ 记录可信度</text><path d="M280 250V273" stroke="#80918d" stroke-width="2" marker-end="url(#arr1)"/><rect x="30" y="285" width="500" height="58" rx="6" fill="#d3e3d8"/><text x="280" y="322" text-anchor="middle" font-size="21">优先复核 → 调整维护与备件安排</text><text x="30" y="394" font-size="23" font-weight="700">动态预测</text><text x="30" y="427" font-size="21">能否在来得及行动时提前提醒</text><rect x="30" y="449" width="500" height="58" rx="6" fill="#e7e7df"/><text x="280" y="486" text-anchor="middle" font-size="21">状态信号 → 未来时段验证</text><path d="M280 511V534" stroke="#80918d" stroke-width="2" marker-end="url(#arr1)"/><rect x="30" y="546" width="500" height="58" rx="6" fill="#dfe2d0"/><text x="280" y="583" text-anchor="middle" font-size="21">有效提前量 ＋ 可执行的维护动作</text><text x="280" y="634" text-anchor="middle" font-size="17" fill="#52645f">共同底线　法定要求与厂家维保不能削弱</text></g></svg>