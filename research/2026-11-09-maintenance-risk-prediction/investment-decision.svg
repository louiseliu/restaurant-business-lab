<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-labelledby="t2 d2"><title id="t2">预测投资的三个判断条件</title><desc id="d2">先确认数据能描述状态变化，再确认提醒后可执行动作，最后以未来结果和完整成本验证经济价值。前两个条件不具备时优先补台账与执行能力，具备后开展有限试点，通过验证才扩大。本图为原创定性示意，非实测数据。</desc><defs><marker id="arr2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#80918d"/></marker></defs><rect width="560" height="700" rx="12" fill="#f5f6f2"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#172e2b"><text x="30" y="43" font-size="24" font-weight="700">预测投入要逐步通过检验</text><text x="30" y="75" font-size="17" fill="#52645f">原创定性示意 · 非实测数据</text><path d="M30 96H530" stroke="#ccd6ce"/><text x="30" y="139" font-size="22" font-weight="700">01　有可靠的状态信息吗</text><text x="30" y="176" font-size="20">设备对应清楚　时间连续　故障口径一致</text><rect x="30" y="198" width="500" height="50" rx="6" fill="#e4ebe3"/><text x="50" y="231" font-size="20">还没有 → 先补台账和数据质量</text><path d="M280 260V284" stroke="#80918d" stroke-width="2" marker-end="url(#arr2)"/><text x="30" y="325" font-size="22" font-weight="700">02　提醒后有时间和能力行动吗</text><text x="30" y="362" font-size="20">专业复核　备件供应　可用维护窗口</text><rect x="30" y="384" width="500" height="50" rx="6" fill="#e4ebe3"/><text x="50" y="417" font-size="20">还没有 → 先补维护执行能力</text><path d="M280 446V470" stroke="#80918d" stroke-width="2" marker-end="url(#arr2)"/><text x="30" y="511" font-size="22" font-weight="700">03　有限试点的收益覆盖全成本吗</text><text x="30" y="548" font-size="20">看未来结果　算误报负担　保留未知</text><rect x="30" y="570" width="500" height="50" rx="6" fill="#d3e3d8"/><text x="50" y="603" font-size="20">证据足够 → 再扩大　不足 → 不急于买</text><text x="30" y="661" font-size="18" fill="#52645f">试点期间照常执行既定安全与维保要求</text></g></svg>